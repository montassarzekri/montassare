# The URL the site will be built for
base_url = "https://montassare.com"
title = "Montassare"
description = "Ai Hater && Software engineer"
theme = "apollo"
build_search_index = true
generate_feeds = true
compile_sass = true
minify_html = true
taxonomies = [{ name = "tags" }]
[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"
error_on_missing_language = true

[extra]
favicon = "/icons/favicon/favicon.ico"

theme = "toggle"              # light, dark, auto, toggle, toggle-auto


menu = [
    { name = "/posts", url = "/posts", weight = 1 },
    { name = "/projects", url = "/projects", weight = 2 },
    { name = "/about", url = "/about", weight = 2 },
    # { name = "/talks", url = "/talks", weight = 3 },
    # { name = "/tags", url = "/tags", weight = 4 },
]

socials = [
    { name = "twitter", url = "https://x.com/Montazzare", icon = "twitter" },
    # { name = "github", url = "https://github.com/montassarzekri", icon = "github" },
]

stylesheets = [
    # "custom.css"    # at /static/custom.css
]

[extra.taxonomies]
sort_by = "page_count"         # e.g. name, page_count
reverse = true
[extra.analytics]
enabled = true
[extra.analytics.umami]
website_id = "37a973c6-e020-4deb-aa48-9e281f5b16fd"
